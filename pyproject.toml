[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-data-grabber"
version = "0.2.0"
description = "Modular TradingView websocket collection, analysis, and charting tools"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "TradingView Data Grabber contributors"}]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tvdata = "tradingview_data.cli:main"

[tool.setuptools.packages.find]
include = ["tradingview_data", "tradingview_data.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
